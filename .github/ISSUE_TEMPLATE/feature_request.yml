name: Request a feature
description: Suggest a new feature or an improvement to an existing component
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      placeholder: Describe what you are trying to build and what is missing
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: A prop, a component part or a Styles API selector, with a short example if you can
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
