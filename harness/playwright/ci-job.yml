# Paste under `jobs:` in .github/workflows/pull_request.yml, beside the existing test job.
# Builds Storybook, serves the static build (playwright.config.ts starts the server) and runs
# the browser tests in Chromium, Firefox and WebKit. The HTML report is uploaded when it fails.
e2e:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
    - uses: actions/checkout@v7
    - name: Enable Corepack
      run: corepack enable
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
        cache-dependency-path: '**/yarn.lock'
    - name: Install dependencies
      run: yarn
    - name: Playwright version
      id: playwright
      run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - name: Cache browsers
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install browsers
      if: steps.browsers.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Install browser system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium firefox webkit
    - name: Build Storybook
      run: npm run storybook:build
    - name: Run browser tests
      run: npx playwright test
    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
